name: Supplier Order Reminder

on:
  schedule:
    # Strictly 3 fixed times/day, Pakistan Time (PKT = UTC+5).
    # No other cron entries exist for this workflow — do not add more.
    - cron: '0 4 * * *'   # 09:00 AM PKT
    - cron: '0 9 * * *'   # 02:00 PM PKT
    - cron: '0 17 * * *'  # 10:00 PM PKT
  workflow_dispatch:

jobs:
  check-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # safety net: force-kill if it ever hangs, so it can't burn hours of quota
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check pending orders and notify
        run: node send-order-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FCM_TOPIC: 'all_users'
name: Supplier Order Reminder

on:
  schedule:
    # 6 AM - 12 PM PKT (01:00 - 07:00 UTC), minute :07 to avoid top-of-hour load
    - cron: '7 1-7 * * *'
  workflow_dispatch:

concurrency:
  group: supplier-order-reminder
  cancel-in-progress: false

jobs:
  check-orders:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check pending orders and notify
        run: node send-order-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FCM_TOPIC: 'all_users'

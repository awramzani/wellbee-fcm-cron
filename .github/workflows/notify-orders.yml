name: Supplier Order Reminder

on:
  schedule:
    # Hourly, 6:00 AM to 11:00 AM PKT (PKT = UTC+5 -> 01:00-06:00 UTC)
    # Runs at: 6, 7, 8, 9, 10, 11 (PKT)
    - cron: '0 1-6 * * *'
    # Extra run at 11:30 AM PKT (06:30 UTC)
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  check-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # safety net: force-kill if it ever hangs, so it can't burn hours of quota
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check pending orders and notify
        run: node send-order-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FCM_TOPIC: 'all_users'

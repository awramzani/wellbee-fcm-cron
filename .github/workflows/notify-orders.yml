name: Supplier Order Reminder

on:
  schedule:
    # Hourly, 7:00 AM to 12:00 PM PKT (PKT = UTC+5 -> 02:00-07:00 UTC)
    # Runs at: 7, 8, 9, 10, 11, 12 (PKT)
    - cron: '0 2-7 * * *'
  workflow_dispatch:

jobs:
  check-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # safety net: force-kill if it ever hangs, so it can't burn hours of quota
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check pending orders and notify
        run: node send-order-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FCM_TOPIC: 'all_users'

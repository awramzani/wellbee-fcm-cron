name: Expire Medicine Reminder

on:
  schedule:
    # Every 2 days at 9:00 AM PKT (04:00 UTC)
    - cron: '0 4 */2 * *'
    # Every 2 days at 6:00 PM PKT (13:00 UTC)
    - cron: '0 13 */2 * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send expiry check reminder
        run: node send-notification.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFICATION_TITLE: '⚠️ Check Expired Medicines'
          NOTIFICATION_BODY: 'Please review the Expired Medicine list and remove or update items as needed.'
          FCM_TOPIC: 'all_users'

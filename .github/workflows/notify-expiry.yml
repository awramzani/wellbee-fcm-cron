name: Expire Medicine Reminder

on:
  schedule:
    # Runs DAILY at 7:00 PM and 9:00 PM PKT (UTC+5). The script itself decides
    # (via true epoch-day parity, see send-expiry-reminder.js) whether
    # today is an actual "send" day — giving accurate every-2-days
    # behavior with no month-boundary drift.
    - cron: '0 14 * * *'  # 07:00 PM PKT
    - cron: '0 16 * * *'  # 09:00 PM PKT
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # safety net: force-kill if it ever hangs, so it can't burn hours of quota
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send expiry check reminder (if scheduled today)
        run: node send-expiry-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_TOPIC: 'all_users'

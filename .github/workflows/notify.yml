name: Send Scheduled Notification

on:
  schedule:
    # Runs at 04:00 UTC = 09:00 AM PKT (Pakistan, UTC+5)
    # Adjust the hour below if you want a different time.
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Lets you trigger this manually from the Actions tab for testing,
    # and optionally override the title/body for that one run.
    inputs:
      title:
        description: 'Notification title (optional override)'
        required: false
      body:
        description: 'Notification body (optional override)'
        required: false

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send notification
        run: node send-notification.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFICATION_TITLE: ${{ github.event.inputs.title }}
          NOTIFICATION_BODY: ${{ github.event.inputs.body }}
          FCM_TOPIC: 'all_users'

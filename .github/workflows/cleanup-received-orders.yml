name: Cleanup Received Orders

on:
  schedule:
    # 11:30 PM PKT (PKT = UTC+5) — once daily, after the day's order/expiry checks
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # safety net: force-kill if it ever hangs
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Delete received orders
        run: node cleanup-received-orders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
